name: Build Finance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'finance-mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: finance-android-apk-main
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build signed Android APK without EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: finance-mobile
    env:
      EXPO_PUBLIC_API_URL: https://finance.pm.sa/api/v1
      EXPO_PUBLIC_API_BASE_URL: https://finance.pm.sa/api/v1
      API_URL: https://finance.pm.sa/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Expo-compatible native modules
        run: npx expo install expo-local-authentication expo-secure-store @expo/vector-icons

      - name: Configure production API
        run: |
          cat > .env <<'ENV'
          EXPO_PUBLIC_API_URL=https://finance.pm.sa/api/v1
          EXPO_PUBLIC_API_BASE_URL=https://finance.pm.sa/api/v1
          API_URL=https://finance.pm.sa/api/v1
          ENV

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Android signing secrets are incomplete."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/finance-release.keystore
          test -s android/app/finance-release.keystore

          cat >> android/gradle.properties <<EOF
          FINANCE_RELEASE_STORE_FILE=finance-release.keystore
          FINANCE_RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          FINANCE_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
          FINANCE_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

          python3 <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle')
          text = path.read_text()

          if 'FINANCE_RELEASE_STORE_FILE' not in text:
              marker = '        debug {'
              start = text.find(marker)
              if start == -1:
                  raise SystemExit('Debug signing config not found')

              depth = 0
              end = None
              for index in range(start, len(text)):
                  char = text[index]
                  if char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              if end is None:
                  raise SystemExit('Debug signing config end not found')

              release_config = """
                  release {
                      storeFile file(FINANCE_RELEASE_STORE_FILE)
                      storePassword FINANCE_RELEASE_STORE_PASSWORD
                      keyAlias FINANCE_RELEASE_KEY_ALIAS
                      keyPassword FINANCE_RELEASE_KEY_PASSWORD
                  }
              """
              text = text[:end] + release_config + text[end:]

          build_types_start = text.find('buildTypes')
          release_start = text.find('release {', build_types_start)
          if release_start == -1:
              raise SystemExit('Release build type not found')

          signing_index = text.find('signingConfig signingConfigs.debug', release_start)
          if signing_index == -1:
              raise SystemExit('Release debug signing reference not found')

          old = 'signingConfig signingConfigs.debug'
          new = 'signingConfig signingConfigs.release'
          text = text[:signing_index] + new + text[signing_index + len(old):]
          path.write_text(text)
          PY

      - name: Build release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain

      - name: Prepare APK files
        run: |
          mkdir -p ../apk-output
          APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" ../apk-output/finance-1.0.9-8.apk
          cp "$APK_PATH" ../apk-output/finance-latest.apk
          sha256sum ../apk-output/*.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-signed-apk-${{ github.sha }}
          path: apk-output/*.apk
          if-no-files-found: error

      - name: Publish commit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          TAG="finance-apk-${GITHUB_SHA}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Finance APK 1.0.9 (8)" --notes "نسخة Android موقعة، مبنية عبر GitHub Actions وGradle دون استخدام EAS."
          gh release upload "$TAG" apk-output/finance-1.0.9-8.apk --clobber
          gh release upload "$TAG" apk-output/finance-latest.apk --clobber

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          gh release view finance-latest-apk >/dev/null 2>&1 || gh release create finance-latest-apk --title "Finance Latest APK" --notes "آخر نسخة APK موقعة مبنية عبر Gradle دون استخدام EAS."
          gh release upload finance-latest-apk apk-output/finance-latest.apk --clobber
