name: Build Finance APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'finance-mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-apk-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK without EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: finance-mobile
    env:
      EXPO_PUBLIC_API_URL: https://finance.pm.sa/api/v1
      EXPO_PUBLIC_API_BASE_URL: https://finance.pm.sa/api/v1
      API_URL: https://finance.pm.sa/api/v1
      EXPO_DEBUG: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Expo-compatible native modules
        run: npx expo install expo-local-authentication expo-secure-store @expo/vector-icons

      - name: Configure production API
        run: |
          cat > .env <<'ENV'
          EXPO_PUBLIC_API_URL=https://finance.pm.sa/api/v1
          EXPO_PUBLIC_API_BASE_URL=https://finance.pm.sa/api/v1
          API_URL=https://finance.pm.sa/api/v1
          ENV

      - name: Validate Expo configuration
        run: npx expo config --type public --json > /tmp/expo-config.json

      - name: Validate Expo module autolinking
        run: |
          npx expo-modules-autolinking search > /tmp/expo-autolinking-search.json
          npx expo-modules-autolinking resolve --platform android > /tmp/expo-autolinking-android.json
          npx expo-modules-autolinking react-native-config --platform android > /tmp/react-native-config.json

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --info --console=plain

      - name: Prepare APK artifact
        run: |
          mkdir -p ../apk-output
          APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" ../apk-output/finance-1.0.9-8.apk
          ls -lh ../apk-output/finance-1.0.9-8.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-apk-1.0.9-8
          path: apk-output/finance-1.0.9-8.apk
          if-no-files-found: error
