name: Build Finance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'finance-mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: finance-android-apk-main
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build signed Android APK without EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: finance-mobile
    env:
      EXPO_PUBLIC_API_URL: https://finance.pm.sa/api/v1
      EXPO_PUBLIC_API_BASE_URL: https://finance.pm.sa/api/v1
      API_URL: https://finance.pm.sa/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Expo-compatible native modules
        run: npx expo install expo-local-authentication expo-secure-store @expo/vector-icons

      - name: Configure production API
        run: |
          cat > .env <<'ENV'
          EXPO_PUBLIC_API_URL=https://finance.pm.sa/api/v1
          EXPO_PUBLIC_API_BASE_URL=https://finance.pm.sa/api/v1
          API_URL=https://finance.pm.sa/api/v1
          ENV

      - name: Validate Expo configuration
        run: |
          npx expo config --type public --json > /tmp/expo-config.json
          npx expo-modules-autolinking react-native-config --platform android > /tmp/react-native-config.json

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain

      - name: Sign and verify APK with production key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64:-}"
          test -n "${KS_PASS:-}"
          test -n "${KS_ALIAS:-}"
          test -n "${KEY_PASS:-}"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > finance-release.keystore
          test -s finance-release.keystore

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          mkdir -p ../apk-output ../apk-work
          APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" ../apk-work/finance-input.apk
          zip -d ../apk-work/finance-input.apk 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/*.MF' >/dev/null 2>&1 || true
          "$BUILD_TOOLS/zipalign" -f -p 4 ../apk-work/finance-input.apk ../apk-work/finance-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks finance-release.keystore \
            --ks-pass env:KS_PASS \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass env:KEY_PASS \
            --out ../apk-output/finance-1.0.9-8.apk \
            ../apk-work/finance-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs ../apk-output/finance-1.0.9-8.apk
          "$BUILD_TOOLS/zipalign" -c -p 4 ../apk-output/finance-1.0.9-8.apk
          cp ../apk-output/finance-1.0.9-8.apk ../apk-output/finance-latest.apk
          sha256sum ../apk-output/*.apk
          ls -lh ../apk-output/*.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-signed-apk-${{ github.sha }}
          path: apk-output/*.apk
          if-no-files-found: error

      - name: Publish commit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          TAG="finance-apk-${GITHUB_SHA}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Finance APK 1.0.9 (8)" --notes "نسخة Android موقعة، مبنية عبر GitHub Actions وGradle دون استخدام EAS."
          gh release upload "$TAG" apk-output/finance-1.0.9-8.apk --clobber
          gh release upload "$TAG" apk-output/finance-latest.apk --clobber

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          gh release view finance-latest-apk >/dev/null 2>&1 || gh release create finance-latest-apk --title "Finance Latest APK" --notes "آخر نسخة APK موقعة مبنية عبر Gradle دون استخدام EAS."
          gh release upload finance-latest-apk apk-output/finance-latest.apk --clobber
