name: Diagnose Finance API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-finance-api.yml'
      - 'finance-api/.diagnose-trigger.txt'

permissions:
  contents: write

jobs:
  diagnose-api:
    name: Diagnose deployed Laravel API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Collect diagnostics from server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p diagnostics
          ssh -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${DEPLOY_USER}@${DEPLOY_HOST}" <<'EOF' > diagnostics/finance-api-diagnostics.txt 2>&1
          set +e
          echo "== Finance API diagnostics =="
          date
          echo
          echo "== Current user and paths =="
          whoami
          pwd
          echo
          echo "== /home/pmsa/apps finance paths =="
          ls -la /home/pmsa/apps | grep -E 'finance|rentals' || true
          echo
          for path in \
            /home/pmsa/apps/finance \
            /home/pmsa/apps/finance/finance-api \
            /home/pmsa/apps/finance-api \
            /home/pmsa/public_html \
            /home/pmsa/public_html/api \
            /home/pmsa/public_html/index.php \
            /home/pmsa/public_html/.htaccess \
            /home/pmsa/public_html/api/index.php \
            /home/pmsa/public_html/api/.htaccess; do
            echo "--- $path"
            ls -ld "$path" 2>&1 || true
            if [ -L "$path" ]; then
              echo "SYMLINK -> $(readlink "$path")"
              echo "REALPATH -> $(realpath "$path" 2>/dev/null)"
            fi
          done
          echo
          echo "== route file checks =="
          for file in \
            /home/pmsa/apps/finance/finance-api/routes/api.php \
            /home/pmsa/apps/finance-api/routes/api.php \
            /home/pmsa/public_html/api/routes/api.php \
            /home/pmsa/public_html/routes/api.php; do
            echo "--- $file"
            if [ -f "$file" ]; then
              grep -nE "auth/login|Route::post\('login'|prefix\('v1'" "$file" || true
            else
              echo "missing"
            fi
          done
          echo
          echo "== Laravel route lists =="
          for dir in \
            /home/pmsa/apps/finance/finance-api \
            /home/pmsa/apps/finance-api \
            /home/pmsa/public_html/api \
            /home/pmsa/public_html; do
            echo "--- $dir"
            if [ -f "$dir/artisan" ]; then
              cd "$dir"
              php artisan route:clear 2>&1 || true
              php artisan route:list --path=api/v1 2>&1 | head -120 || true
            else
              echo "no artisan"
            fi
          done
          echo
          echo "== Recover recent Finance profit/capital report =="
          for dir in \
            /mnt/home-storage/home/pmsa/apps/finance/finance-mobile \
            /mnt/home-storage/home/pmsa/apps/finance/finance-mobile-starter \
            /home/pmsa/apps/finance/finance-mobile \
            /home/pmsa/apps/finance/finance-mobile-starter; do
            echo "--- $dir"
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 8 -type f \( -name '*.tsx' -o -name '*.ts' -o -name '*.php' -o -name '*.bak*' -o -name '*backup*' \) \
                -not -path '*/node_modules/*' -print0 2>/dev/null \
                | xargs -0 grep -nE 'تقرير الأرباح ورأس المال|ربح أحمد المحقق|ربح علي المحقق|المبلغ المتبقي لأحمد|رأس المال المتبقي|إجمالي أرباح أحمد المتوقعة|إجمالي حصة علي المتوقعة' 2>/dev/null \
                | head -200 || true
              echo "-- recent stats/report-like files --"
              find "$dir" -maxdepth 8 -type f \( -iname '*stats*' -o -iname '*report*' -o -iname '*.bak*' \) \
                -not -path '*/node_modules/*' -printf '%TY-%Tm-%Td %TH:%TM %p\n' 2>/dev/null \
                | sort -r | head -120 || true
            fi
          done
          echo
          echo
          echo "== Capital report source recovery =="
          MOBILE="/mnt/home-storage/home/pmsa/apps/finance/finance-mobile"
          for file in \
            "$MOBILE/src/app/(protected)/stats/capital-report.tsx" \
            "$MOBILE/src/app/(protected)/(tabs)/stats.tsx.bak-capital-report-20260926" \
            "$MOBILE/src/services/api.ts.bak-capital-report-20260926" \
            "$MOBILE/src/types/api.ts.bak-capital-report-20260926" \
            "$MOBILE/src/app/(protected)/_layout.tsx.bak-capital-report-20260926"; do
            echo "===== FILE: $file ====="
            if [ -f "$file" ]; then
              sed -n '1,420p' "$file"
            else
              echo "missing"
            fi
          done
          echo
          echo "== Backend capital report references =="
          API="/mnt/home-storage/home/pmsa/apps/finance/finance-api"
          if [ -d "$API" ]; then
            grep -R -nE 'capital.report|capital_report|CapitalReport|realized_ahmad|remaining_for_ahmad|active_remaining_capital|stuck_remaining_capital' \
              "$API/app" "$API/routes" 2>/dev/null | head -300 || true
          fi
          echo
          echo
          echo "== HTTP tests =="
          echo "--- POST https://my.pm.sa/api/v1/auth/login"
          curl -k -i -s -X POST 'https://my.pm.sa/api/v1/auth/login' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"login":"__diagnostic__","password":"__diagnostic__"}' | head -80 || true
          echo
          echo "--- POST https://my.pm.sa/api/v1/login"
          curl -k -i -s -X POST 'https://my.pm.sa/api/v1/login' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"login":"__diagnostic__","password":"__diagnostic__"}' | head -80 || true
          echo
          echo "--- GET https://my.pm.sa/up"
          curl -k -i -s 'https://my.pm.sa/up' | head -40 || true
          echo
          echo "--- GET https://my.pm.sa/api/up"
          curl -k -i -s 'https://my.pm.sa/api/up' | head -40 || true
          EOF

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/finance-api-diagnostics.txt
          git commit -m "Add Finance API diagnostics" || exit 0
          git push
